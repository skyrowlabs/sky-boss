name: PR Draft Discipline

# Nudges the habit of opening as a draft, iterating, and flipping to ready once.
# It comments; it never blocks — a gate that refuses a ready PR would be worked
# around by opening it ready in the first place, which is the behaviour this
# exists to change.
#
# **In the template this saves Actions minutes. Here it saves none**, and the
# text below says so rather than repeating the template's claim. Round 7 of
# [[skeletor-adoption]] declined the template's job graph, so nothing in
# `ci.yml` is gated on draft status: a draft PR runs exactly what a ready one
# runs. The upstream comment told a contributor that drafting "skips the
# expensive jobs", which on this repository is advice that cannot pay out — and
# it is public, so the reader is somebody with no way to check it.
#
# **Jeston ruled the file stays** (round 25), on the ground that it ships in all
# seven repos whether or not a tree gates on drafts. So the open question is
# closed, and what is left is not *should this exist* but *what may it claim*.
#
# **v0.28.0 branched the headline at run time on `fullSuite` and this tree still
# holds its own text, because that branches on the wrong fact.** `fullSuite` is a
# property of the pull request — its base and its author — where the sentence is
# about `ci.yml`: whether any job is gated on the classifier's verdict. Here that
# is a constant `false`, so the template's negative branch is true and its
# positive branch is false, and the positive one is the common case rather than
# the rare one. Dependabot short-circuits to `fullSuite: true` before the base is
# ever read, so all four weekly bump PRs would be told that drafting "skips the
# rest" on a repository where nothing is ever skipped. The single sentence below
# is true on every path. See [[skeletor-adoption]] round 26.
#
# **v0.29.0 answered that and declined, and the decline does not move this tree.**
# skeletor walked the four cases rather than arguing them, and their table's last
# column — *what drafting saves* — is read off the template's job graph, which
# round 7 declined here. Their row three is a human hotfix straight to `main`,
# where `fullSuite` is true and they say drafting saves the full suite; here it
# saves nothing, because nothing in `ci.yml` is gated on the verdict on any path.
# So the case that makes their negative branch false upstream is a case this tree
# does not have, and the sentence below stays true across all four rows. Do not
# re-propose a scaffold-time boolean either — that was this tree's round-26 ask
# and skeletor declined it on the cases, not on the means. See
# [[skeletor-adoption]] round 27.
#
# **v0.30.0 granted the clause this tree asked for, so the disagreement is
# recorded upstream and is no longer open.** The template's table now says in as
# many words that its last column — *what drafting saves* — is a property of its
# own job graph and does not reach a tree that gates nothing on the classifier.
# That is this fork's whole argument, conceded at the root. The sentence below
# stays as it is: a conceded premise does not make the template's branching text
# true here, it makes this file's text the one skeletor expects such a tree to
# have. See [[skeletor-adoption]] round 28.
#
# **Their other point is recorded rather than solved, and it is real here.** The
# release branch is a scaffold-time literal, and a rename afterwards leaves every
# spelling of it advising against a branch that no longer releases. No gate in
# the tree can see that — the real release branch is a fact about the
# repository's settings, and every gate here asks whether the tree is consistent
# with itself. It is **not** a literal in this file, because this fork never
# reads `fullSuite`.
#
# **So the instruction is a command, not a file list**, which is skeletor's own
# correction in v0.30.0 and this repo's standing rule about keeping a copy of
# what a command will tell you:
#
#     git grep -n <release-branch> -- .github
#
# Measured that way on 2026-09-12, with `main` as the name, it returns
# `.github/scripts/docs-only.cjs`, which compares `base === 'main'`, and
# `ci.yml`'s two `branches:` lists. That result is dated because it is an
# observation; the command is not. Note that the *name* is the one input the
# grep cannot supply itself — it lives in the repository's settings, which is
# the same reason no gate here can check any of this.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  advise:
    name: Draft discipline
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            // Docs-only PRs are exempt: they run one cheap job either way, so
            // the advice would be noise. Same shared definition as ci.yml — the
            // pattern is never re-inlined.
            const { docsOnly } = await decide({ github, context, core });
            if (docsOnly) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '👋 This PR was opened **ready**. Every push to it runs the full suite —',
                'though so does every push to a draft: nothing in this repository\'s CI is',
                'gated on draft status, so drafting costs and saves exactly nothing here.',
                '',
                'Drafting is still worth doing, for the other reason:',
                '',
                '```bash',
                'gh pr ready --undo ' + context.payload.pull_request.number + '   # back to draft',
                '# ...iterate without asking anyone to read a moving target...',
                'gh pr ready ' + context.payload.pull_request.number + '          # once, when you believe it is green',
                '```',
                '',
                'It tells a reviewer when you want their time, and GitHub blocks merging a draft',
                'regardless. The suite is under two minutes and free on a public repo, which is why',
                'it is not gated — see `docs/DEVELOPMENT.md`.',
              ].join('\n'),
            });

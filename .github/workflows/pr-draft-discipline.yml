name: PR Draft Discipline

# Nudges the habit of opening as a draft, iterating, and flipping to ready once.
# It comments; it never blocks — a gate that refuses a ready PR would be worked
# around by opening it ready in the first place, which is the behaviour this
# exists to change.
#
# **In the template this saves Actions minutes. Here it saves none**, and the
# text below says so rather than repeating the template's claim. Round 7 of
# [[skeletor-adoption]] declined the template's job graph, so nothing in
# `ci.yml` is gated on draft status: a draft PR runs exactly what a ready one
# runs. The upstream comment told a contributor that drafting "skips the
# expensive jobs", which on this repository is advice that cannot pay out — and
# it is public, so the reader is somebody with no way to check it.
#
# **Jeston ruled the file stays** (round 25), on the ground that it ships in all
# seven repos whether or not a tree gates on drafts. So the open question is
# closed, and what is left is not *should this exist* but *what may it claim*.
#
# **v0.28.0 branched the headline at run time on `fullSuite` and this tree still
# holds its own text, because that branches on the wrong fact.** `fullSuite` is a
# property of the pull request — its base and its author — where the sentence is
# about `ci.yml`: whether any job is gated on the classifier's verdict. Here that
# is a constant `false`, so the template's negative branch is true and its
# positive branch is false, and the positive one is the common case rather than
# the rare one. Dependabot short-circuits to `fullSuite: true` before the base is
# ever read, so all four weekly bump PRs would be told that drafting "skips the
# rest" on a repository where nothing is ever skipped. The single sentence below
# is true on every path. See [[skeletor-adoption]] round 26.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  advise:
    name: Draft discipline
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            // Docs-only PRs are exempt: they run one cheap job either way, so
            // the advice would be noise. Same shared definition as ci.yml — the
            // pattern is never re-inlined.
            const { docsOnly } = await decide({ github, context, core });
            if (docsOnly) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '👋 This PR was opened **ready**. Every push to it runs the full suite —',
                'though so does every push to a draft: nothing in this repository\'s CI is',
                'gated on draft status, so drafting costs and saves exactly nothing here.',
                '',
                'Drafting is still worth doing, for the other reason:',
                '',
                '```bash',
                'gh pr ready --undo ' + context.payload.pull_request.number + '   # back to draft',
                '# ...iterate without asking anyone to read a moving target...',
                'gh pr ready ' + context.payload.pull_request.number + '          # once, when you believe it is green',
                '```',
                '',
                'It tells a reviewer when you want their time, and GitHub blocks merging a draft',
                'regardless. The suite is under two minutes and free on a public repo, which is why',
                'it is not gated — see `docs/DEVELOPMENT.md`.',
              ].join('\n'),
            });

# The whole suite, on every push and every pull request.
#
# **This file used to say there was no cost gating and that it was deliberate**:
# gating keeps an expensive suite off the pre-merge path, and this one is under
# ten seconds with no network, so deciding cost more than running. That argument
# still holds for the suite, and the `gate` job below does NOT gate it in the
# sense of skipping work by decision: nothing here is conditional on the gate's
# output, and the pytest matrix and eslint run on every event that reaches them.
#
# **They do, however, carry `needs: gate`, and that sentence used to end
# "unconditionally", which was false about this file in the one direction that
# mattered.** The paragraph correctly stated the hazard — a required context
# reporting `skipped` is ACCEPTED by branch protection — and then claimed a
# mitigation the graph does not implement. A `needs:` edge is exactly how a job
# comes to report `skipped`: if `gate` fails, `test` and `lint` never run, all
# three required contexts report `skipped`, protection accepts them, and a pull
# request merges having proven nothing. Named in the template's own header at
# v0.22.0 as *requiring only the leaves is requiring nothing*, and confirmed
# here by asking the account rather than the file:
#
#     gh api repos/OWNER/REPO/branches/develop/protection/required_status_checks \
#       --jq '.contexts[]'      # → eslint, pytest 3.12, pytest 3.14
#
# The remedy was in the account, not here, and was applied on 2026-09-07: the
# required list now names `CI Gate` itself. It had to name that, or a job that
# transitively depends on every other. Dropping the
# `needs:` edges would also make the old sentence true and is the wrong trade —
# the edge is what `tests/test_workflow_job_graph.py` reads to see which jobs
# block, and losing it to fix a setting outside the tree spends a mechanism to
# work around a list.
#
# **No check in this tree can catch it**, which is why it stood: the required
# contexts are a list in the account and appear in no file here. Same class as
# the enterprise Actions pull-request switch, and the same remedy — ask, do not
# keep a copy.
#
# What the gate buys here is not skipping. It is the structural checks, one
# place that decides what a change earns, and a `needs:` edge so
# `tests/test_workflow_job_graph.py` can see which jobs are blocking. The
# decision is published as an output so a future expensive job can consume it
# without a second copy of the rule.
#
# **Both jobs need `fetch-depth: 0`, and each names its own caller.** This
# paragraph has been wrong in both directions within one day, so the rule it
# ended on is: a depth is justified by the line that reads history, never by a
# paragraph. `gate` reads a commit range (`check_commit_style.py`); `test` asks
# `git log --all` whether a symbol a doc names was ever ours, and refuses
# outright against a shallow clone rather than passing having looked at nothing.
#
# The depth was removed from `gate` earlier the same day and that was correct at
# the time: this fork ran no commit-range read at all, so the setting had a
# comment justifying it and no caller. Restoring it alongside the caller is the
# opposite move, not a reversal.
#
# The one thing never to add is `paths-ignore`, which makes a required check
# that never reports and blocks a PR forever.

name: CI

# Both branches, on push and on pull request. `develop` is where work lands and
# `main` is what has been released, so a change is gated twice — once entering
# integration, once leaving it — and neither gate is the expensive kind.
#
# Running on a *direct push* to `develop` as well as on pull requests into it is
# where this parts company with jam.sense, which runs neither and catches a bad
# direct push with a nightly host job. That trade buys runner minutes, and this
# repo has nothing to buy them with: five jobs, under a minute, free on a public
# repo. The rule at the top of this file applies to the branch axis too — the
# deciding would cost more than the running.
#
# `workflow_dispatch` so a branch with no new commits can still be given a run.
# A freshly cut `develop` has none, and the portfolio site reads *the default
# branch's* latest conclusion — so without this, cutting the branch would drop
# the CI badge off the site until the next push, which reads exactly like a
# project that has no CI rather than one that has not run yet.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # `ready_for_review` is load-bearing **only where the verdict changes on
    # that transition**, and in this fork there is no such transition: no job
    # here is gated on draft status or on the gate's output, so a draft PR
    # already runs everything a ready one runs. Removing it today would cost
    # nothing, and the sentence that used to stand here — that the PR would
    # otherwise merge having proven nothing — was a conditional dressed as an
    # assertion, with an antecedent this workflow does not satisfy.
    #
    # It stays because the cost of keeping it is zero and the cost of the
    # reverse mistake is not: the day a job *is* gated, the event it needs would
    # have to be re-added by whoever adds the job, and nothing would fail to
    # remind them. `tests/test_ci_draft_gate.py` fails if it disappears.
    #
    # skeletor corrected the same sentence in v0.26.0, arriving at the same rule
    # from its own graph — where the classifier returns one verdict for a draft
    # carrying code and for a ready code change into `develop`. That paragraph
    # is not ported: it reasons about jobs round 7 declined, and a prose
    # divergence in a file the template actively revises is a standing conflict
    # bought for nothing. The rule is the same; the reason here is stronger.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A public repo means pushes to a PR arrive from people who are not watching
# the Actions tab. Superseded runs are cancelled rather than left to finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default. A fork PR gets a read-only token anyway; saying so
# means a workflow that later wants more has to ask for it in the diff.
permissions:
  contents: read

jobs:
  # One place that decides what a change earns, and the only job with full
  # history. `docs-only.cjs` is required rather than re-inlined: two copies of
  # that rule drift, and the copy that is wrong is the one deciding whether
  # tests run. It fails OPEN — an API error or an unrecognised path leaves
  # `full_suite` true and runs everything.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.decide.outputs.full_suite }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      # Full history, for the commit-range read at the end of this job and
      # nothing else. `docs-only.cjs` classifies through the GitHub API and the
      # structural checks touch no history, so if that last step ever goes, this
      # line goes with it in the same edit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The CEILING, not the floor, and deliberately one version rather than a
      # matrix. Nothing in this job is version-sensitive — three structural
      # readers and a subprocess to a bash hook — so a second leg would buy a
      # duplicate rather than a data point, and the two failure modes a matrix
      # exists to catch are already covered where they live: the unit suite runs
      # on 3.12 and 3.14 and imports these same `scripts/` modules, so the floor
      # is exercised there. Pinning this to the floor as well would be a third
      # copy of a promise `pyproject.toml` already makes.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Decide what this change earns
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            const result = await decide({ github, context, core });
            core.setOutput('docs_only', String(result.docsOnly));
            core.setOutput('full_suite', String(result.fullSuite));
            core.summary
              .addHeading('CI Gate')
              .addTable([
                [{data: 'Question', header: true}, {data: 'Answer', header: true}],
                ['Docs-only change', String(result.docsOnly)],
                ['Full suite', String(result.fullSuite)],
                ['Reason', result.reason],
              ])
              .write();

      # These need no venv and no dependencies, so they belong here rather than
      # behind the matrix: a structural fault should fail once, early, not twice.
      - name: Fast structural checks
        run: |
          python scripts/check_doc_tables.py
          python scripts/check_source_doc_refs.py
          python scripts/check_output_discipline.py

      # The `commit-msg` hook, applied to the range this event carries. The hook
      # binds whoever ran `pre-commit install`; this binds everyone else, which
      # is the whole reason it is here rather than only in `check pre-push`.
      #
      # NOT `check_commit_subjects.py`, which is the neighbouring script and the
      # obvious-looking choice. That one asks whether Release Please can parse a
      # subject, reading its vocabulary from a config a `--versioning tag` tree
      # does not have — so here it finds no contract and exits 0 on every commit
      # forever. Wiring it in would have been a green step that never looked.
      - name: Commit subjects the hook would have caught
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          # A force-push's `before` names a commit no ref reaches, and a new
          # branch's is all zeros. Neither is a base, and asking git to resolve
          # a range against one is an error rather than an empty set — so the
          # branch that MEANS head alone says so, instead of arriving there by
          # a failure that happens to look like a pass.
          if [ "$FORCED" = "true" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base for this event — checking HEAD alone"
            python scripts/check_commit_style.py --range -1
          else
            python scripts/check_commit_style.py --range "$BASE..${{ github.sha }}"
          fi

  test:
    # **The floor of this list is the number the README is allowed to say.**
    # `README.md` promises a range, and for one job that was a belief rather
    # than a check: every file parsed as floor syntax and `tomllib` is 3.11+,
    # so the claim was plausible and nothing verified it. A contributor on a
    # distro Python would have been the one to find out. The matrix found a
    # real break on its first run — a PEP 701 f-string, which is 3.12 syntax,
    # in a file that had been checked with `ast.parse(feature_version=…)` and
    # passed because that argument cannot see a tokenizer change.
    #
    # **Floor and ceiling only, as of 2026-09-05.** The two failure modes a
    # version matrix exists to catch both live at the ends: syntax newer than
    # the floor fails on the floor, and a removed or deprecated API fails on
    # the newest. A break unique to the middle of the range is the case this
    # gives up, and it is the rare one. What it buys is not runner minutes —
    # the jobs are parallel and free on a public repo, so four cost the same
    # wall-clock as two — but the number of required checks two protected
    # branches have to carry.
    #
    # The floor moved 3.11 → 3.12 the same day, which is what makes PEP 701
    # available. Debian 12 ships 3.11 and is what that cost; Ubuntu 24.04 LTS
    # ships 3.12 and is what it kept. Raising it again is a README edit and a
    # branch-protection edit, in that order, and never one without the other.
    #
    # **And a `.skeletor.json` edit, which is the half this comment was missing
    # and the template added at v0.22.0.** The list below is RENDERED from the
    # recorded `--python-ceiling`, so it is changed by moving the record:
    #
    #     skeletor-upgrade . --set-arg python-ceiling=<version> --dry-run
    #
    # Editing the list here instead leaves the record saying the old value —
    # which is what the base still renders — so the hunk conflicts on every
    # upgrade, for ever, while the tree stays green and current the whole time.
    # Two adopters were in that state and neither was found by an instrument.
    # This tree is not one of them: the ceiling moved to 3.14 through `--set-arg`
    # in round 14, which is why this list and the manifest agree.
    #
    # `fail-fast: false` because the useful answer is *which* versions broke.
    # Cancelling the rest on the first red turns two data points into one.
    name: pytest ${{ matrix.python }}
    # Depends on the gate, gated by nothing — no step here is conditional on
    # its output. But `needs:` is itself how a job comes to report `skipped`,
    # and `skipped` satisfies branch protection: see the header, which used to
    # claim this job ran unconditionally and did not. Closed on 2026-09-07 by
    # adding `CI Gate` to the required set on both branches — in the account,
    # never here by cutting this edge. Ask the API rather than trusting this
    # comment; it is a list this file cannot see and cannot keep.
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      # Full history, and this is a required condition rather than a habit.
      # `tests/test_docs_name_live_code.py` asks `git log --all` whether a
      # symbol a doc names was ever ours; against a shallow clone that finds
      # nothing, so every reference reads as never-ours and the file passes by
      # *seeing* nothing rather than by *finding* nothing. It refuses instead —
      # and refused here, on the first CI run after this workflow was merged by
      # hand, because only the `gate` job above had been given the depth.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # A real `.venv`, not a bare `pip install`, and this is load-bearing.
      # `tests/test_readme.py` runs the README's examples through the actual
      # `sb` wrapper with `PATH` pinned to `<repo>:/usr/bin:/bin` — so it finds
      # `./sb`, which prefers `.venv/bin/python` and otherwise falls back to
      # `/usr/bin/python3`, where nothing this workflow installed would be.
      # Without the venv those examples fail on a runner and pass everywhere
      # else, which is the worst shape a CI failure can have.
      - name: Create the venv the wrapper expects
        run: python -m venv .venv

      - name: Install
        run: |
          .venv/bin/python -m pip install --upgrade pip
          # One `-r` per line, deliberately. `tests/test_setup_blocks_agree.py`
          # reads which requirements files CI installs with a regex that
          # captures a single target per `pip install`, so three `-r` flags on
          # one line are seen as one file and the other two read as documented
          # by nobody. Reported upstream; splitting is clearer regardless.
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install -r scripts/requirements.txt

      # `pywebview` installs here but its GTK bindings (`gi`) are system-owned
      # and absent on a runner. That is fine and checked: `skyboss/canvas/shell.py`
      # imports both lazily, inside the functions that open a window, so no
      # test imports either. If a test ever does, this job is where it surfaces.
      - name: Suite
        run: .venv/bin/python -m pytest -q -m unit --junitxml=tmp/junit.xml

      # Gates that came from skeletor. They arrived as components and are now
      # the scaffold's — `.skeletor.json` tracks them with everything else, and
      # `bin/skeletor-upgrade --dry-run` is the one question to ask about them.
      #
      # They are steps in this job rather than a job of their own on purpose. A
      # required check is *named* in branch protection, not discovered, so a new
      # job means editing protection on `develop` and `main` in the same sitting
      # — and a context no job reports blocks every pull request forever. Steps
      # cost nothing and gate exactly as hard.
      #
      # The skip ratchet reads the junit the step above writes. It refuses
      # rather than passing when that report is missing, which is the property
      # worth having: "I could not measure" is never "the budget is respected".
      - name: Gates
        run: |
          .venv/bin/python scripts/check_doc_links.py
          .venv/bin/python scripts/check_skip_budget.py --suite unit

      # The blocking set only — E9 syntax errors, F63/F7 always-wrong
      # comparisons, F82 undefined names, F401 unused imports. It arrived with
      # v0.16.0's patch, which this workflow could not take: the template's
      # change converts a flake8 step that did not exist here, and porting it as
      # "not applicable" would have left the gate missing while the file it
      # patches claims to run it.
      #
      # The INFORMATIONAL step beside it upstream is deliberately not taken.
      # That is the complexity pass, and it is what v0.16.0 exists to fix: a
      # channel whose severity does not mean what it says. This repo has no
      # complexity budget to report against, so importing it would add a
      # miscalibrated surface and nothing else.
      #
      # Pinned to one matrix leg. The rule set is a property of the source, not
      # of the interpreter, so running it on both is the duplicate-work shape
      # dream-doll found as eslint-twice — same finding, one file over.
      - name: flake8 (blocking set)
        if: matrix.python == '3.12'
        run: .venv/bin/python -m flake8 . --select=E9,F63,F7,F82,F401 --show-source --statistics

      # The type check. A STEP for the reason the Gates step above is one — a
      # required check is *named* in branch protection, not discovered, so a job
      # would mean editing protection on `develop` and `main` in the same
      # sitting, and a context no job reports blocks every pull request for ever.
      # A step gates exactly as hard and changes no context.
      #
      # Until 2026-09-09 nothing in this workflow ran pyright at all: round 7
      # declined the template's job graph, and the type check was left blocking
      # every local commit — the pre-commit hook and `dev check pre-push` — and
      # nothing else. That hole is only reachable by a contributor who uses
      # neither, which is precisely the contributor this repository has, being
      # the one public tree here. The operator's ruling, and it is his to make:
      # what gates the branch is not an upgrade's decision.
      #
      # **Through the wrapper, which is the opposite of what `docs/rules/python.md`
      # prescribes, because that rule's premise is false in this tree.** It says
      # CI should call pyright directly, on the grounds that the template's
      # type-check job installs `.github/pyright-deps.txt` onto the runner's
      # interpreter with no `.venv` in the checkout — so the interpreter question
      # is answered by construction and a wrapper adds a moving part. Here the
      # type check rides inside the pytest job, which builds a `.venv` and
      # installs everything into it; the runner's own interpreter is therefore
      # BARE. So a fall-through — `venvPath`/`venv` removed from
      # pyrightconfig.json, or these steps reordered — lands on an interpreter
      # with no `click`, and `reportMissingImports` is `none`, so pyright would
      # not say so. It would report ~27 errors in files the commit never touched,
      # none of them naming click. The wrapper turns exactly that into one line
      # saying ENVIRONMENT fault, and does not run pyright. The premise is
      # inverted here, so the conclusion is too.
      #
      # Pinned to one matrix leg on the same argument as flake8, and this one is
      # stronger: `pyrightconfig.json` sets `pythonVersion: "3.12"`, so the
      # analysis does not vary with the interpreter running it at all.
      #
      # `pip install -r .github/pyright-deps.txt` is what makes that file live
      # rather than decorative. It resolves to the three requirements files the
      # step above already installed, so today it changes nothing — that is the
      # point. It states the set pyright is entitled to, so a later trim of the
      # Install step cannot silently take a package away from the type checker,
      # and `tests/test_pyright_deps_reach_ci.py` holds the two to each other.
      - name: pyright
        if: matrix.python == '3.12'
        run: |
          .venv/bin/pip install -r .github/pyright-deps.txt
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python scripts/lint_pyright_gate.py --project pyrightconfig.json

  lint:
    name: eslint
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `--max-warnings=0` is a ratchet, and it starts at zero because the tree
      # was clean the day lint arrived. It may only go down. Raising it to make
      # a commit pass is the one edit this job exists to prevent.
      - run: npm run lint:check

      # The pure half of the frontend — [[canvas]] round 12. `node --test` is
      # built into node 22, so this costs no dependency. It does not replace the
      # headless render CLAUDE.md calls an obligation: a runner cannot see an
      # unpainted mark or a control off the edge of the screen.
      - run: npm test

  # A single context meaning "everything above passed". It exists for two
  # reasons and neither is decoration.
  #
  # `tests/test_pre_push_covers_ci.py` derives *blocking* from `needs:` — a job
  # is blocking when another job waits on it — so without an edge pointing at
  # them, the pytest matrix and eslint were invisible to the scan and it found
  # nothing to hold `dev check pre-push` against. A gate nobody depends on is
  # not a gate.
  #
  # And it is the one context worth requiring in branch protection if the three
  # named there are ever replaced: it stays correct as jobs are added, where a
  # list of names has to be edited on `develop` and `main` in the same sitting.
  # Nothing is required on it today — adding a required context that has never
  # reported would block every pull request immediately.
  verdict:
    name: All checks
    needs: [gate, test, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          # The only consumer of the gate's verdict in this file, and it
          # REPORTS rather than gates. Said plainly because the obvious reading
          # of this line is the opposite one: nothing here is skipped on it, for
          # the reason at the top of the file. When a genuinely expensive job
          # arrives, it is this output it should be gated on.
          FULL_SUITE: ${{ needs.gate.outputs.full_suite }}
        run: |
          echo "full suite: $FULL_SUITE"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "a required job failed"
            exit 1
          fi
          echo "all green"

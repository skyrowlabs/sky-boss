# Weekly, and grouped. Three ecosystems live here: the Python project, the
# eslint/test tooling at the root, and the Electron shell's own package.json.
#
# Grouped into one PR per ecosystem on purpose. Ungrouped, a quiet week is five
# pull requests against a repo whose whole suite runs in ten seconds — the
# review cost is per-PR, not per-bump, so the grouping is where the saving is.
#
# Every entry sets `commit-message.prefix` and deliberately omits
# `include: scope`. Left to itself, Dependabot copies this repo's style and
# writes `chore(deps-dev): bump the tooling group across 1 directory with 3
# updates` — 73 characters against the commit hook's 72, and it only grows with
# the update count. The hook's scope is optional, so dropping `(deps)` and
# `(deps-dev)` buys eleven characters without loosening any gate. Renaming a
# group buys two or three. scripts/check_commit_subjects.py runs the hook over
# every commit in a pull request, a bot's included (BOTS_EXEMPT_FROM_LENGTH =
# False), and that is on purpose.
#
# `labels:` restates Dependabot's defaults, so `dev doctor` can check they exist.
#
# `cooldown` holds a release back five days, because dependabot-auto-merge.yml
# merges a green minor or patch bump unattended, and a hijacked package is
# usually yanked inside that window.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    cooldown:
      default-days: 5
    # Pinned twice, here and in .pre-commit-config.yaml, and
    # tests/test_lint_tool_parity.py is red until both agree, so a bump of
    # one alone could never merge. Bump both by hand.
    ignore:
      - dependency-name: black
      - dependency-name: flake8
      - dependency-name: isort
      - dependency-name: pyright
    labels: [dependencies, python]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ['*']
    cooldown:
      default-days: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore

  # The native window. Separate because it is a separate lockfile, not because
  # it wants a different cadence.
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: ['*']
    cooldown:
      default-days: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore

  # The one nobody remembers. A pinned action goes stale silently and a
  # deprecated runner image is how a green suite stops running at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 5
    labels: [dependencies, github_actions]
    commit-message:
      prefix: chore

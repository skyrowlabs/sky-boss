# Names in `.env.example` shaped like a credential that are not one, and why.
# `tests/test_env_example_parity.py` requires `# secret` above every name that
# `tests/guards.py`'s SECRET_NAME matches; a name listed here is excused.
#
# Format:
#   <NAME>: <why it is not a credential>
#
# An entry for a name that is tagged, undeclared, or no longer secret-shaped is
# stale and fails the test, so an exemption cannot outlive what it was written for.

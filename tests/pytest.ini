# Pytest configuration for the sky.boss suite.
#
# Lives in tests/ as well as the root config so that runs which mount only a
# service directory plus tests/ get the same marker registration and
# --strict-markers enforcement as a host run. Keep the two in sync — the root
# copy is what applies when pytest is invoked without a tests/ path.
[pytest]
addopts = --strict-markers

# A test that `return`s instead of asserting cannot fail: pytest discards the
# value, so `return all_found` passes whatever all_found is. pytest will make
# this an error eventually; making it one now means the class breaks on our
# schedule rather than all at once during a version bump.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

# Per-test wall-clock bound (pytest-timeout). It exists to NAME a hang, not to
# police slowness: without it one hung test consumes the whole job budget and
# reports no culprit.
#
# SIZE THIS AGAINST CI DURATIONS, NOT LOCAL ONES. A margin that looks enormous
# locally can be 2x in CI, which is close enough to flake. A genuinely long test
# overrides with @pytest.mark.timeout(N) rather than loosening it for everyone.
#
# Declared as an ini key rather than a --timeout flag on purpose: an unknown ini
# key is a warning when pytest-timeout is absent, whereas an unknown CLI flag is
# a hard error that breaks every suite for anyone without the plugin.
timeout = 120

markers =
    unit: host-side tests, no running services required
    integration: requires the stack up and seeded
    manual: never in scheduled CI (E2E, live third-party, paid APIs)
    slow: slow-running test
    security: security test
    ui: drives a user interface — a TUI pilot, a browser, an Electron window

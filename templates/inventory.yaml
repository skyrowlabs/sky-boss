# tackle-box machine record — template
#
# One file per machine, named for its hostname. Seed a new one with:
#     tb fleet describe --seed
#
# The file has two halves and the split is the whole point:
#
#   derived   Facts a command can answer. Written by `tb fleet describe --seed`
#             and refreshed by `tb fleet update --apply`. Do not hand-edit —
#             your edits are what the next refresh overwrites.
#
#   declared  Facts nothing can derive. Yours alone. No command will ever write,
#             reorder, or reformat this block. The git diff of these files is
#             the maintenance log, so record the *why* inline as a comment on
#             the field it belongs to.

derived:
  hostname:
  vendor:
  product:
  board:
  distro:
  cpu_model:
  cpu_logical:
  memory_total_bytes:
  disks: []
  gpus: []

declared:
  role:           # what this machine is for
  purchased:      # YYYY-MM-DD
  location:       # where it physically lives
  warranty_end:   # YYYY-MM-DD
  notes:          # anything a command cannot answer

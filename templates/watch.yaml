# A watched condition, rendered on the tb tui rail.
#
# A watch may only name `check` or `info` — the read moods. Anything that acts
# is a job: see jobs/_template.yaml and `tb auto`. That is not only a safety
# rule; a watch refreshes concurrently with whatever you are typing, and that
# is only safe because a read verb cannot take a lane lock.

command: check drift        # required. `check …` or `info …`, nothing else
every: 15m                  # 30s / 15m / 1h. Default 15m
hosts: []                   # empty means every machine; else a list of hostnames

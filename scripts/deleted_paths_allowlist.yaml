# Citations of a path a push deleted or renamed away that stay on purpose, one
# decision per entry. `scripts/check_deleted_paths.py` reads it.
#
# `<file>:<old path>: reason`. A reason is required: `scripts/allowlist.py`
# drops an entry without one. Put double quotes round a reason that opens with a
# backtick or holds a colon and a space; the reader takes them off.
#
# Ships empty, because every entry is a tree's own: the check fires only at the
# push that deletes the path. An entry whose file no longer names the path, whose
# file is gone, or whose path is tracked again is stale and fails the check.


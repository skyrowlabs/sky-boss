# References to `docs/...` paths and `#fragments` that name nothing real BY
# DESIGN, and why. `check_source_doc_refs.py` reads the path entries;
# `check_doc_links.py` reads the `path#fragment` entries. One reader for the
# format: `scripts/allowlist.py`, which drops an entry with no reason.
#
# Legitimate: help-text examples, output destinations a run creates, test
# fixtures, template placeholders, in-app routes that look like anchors.
# NOT legitimate: a reference that broke when a plan was filed. Repoint it.
#
# An entry whose reference no longer appears anywhere is stale and fails
# `tests/test_doc_refs_allowlist.py`; delete it rather than re-justify it.


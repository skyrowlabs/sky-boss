# The tools — commands you save.
#
# Copy this to $SB_HOME/tools.toml (default ~/.sky-boss/tools.toml) and edit
# it. You can also let sb write an entry for you: append --save=NAME to a
# read, data or follow that just worked and it appends a block like the ones
# below, then runs. It only ever appends — nothing above the new block is
# rewritten, and a name that already exists is refused rather than replaced,
# because --save saves by example.
#
# The workbench in `sb ui` writes too: it creates, replaces and deletes. A
# write splices one block's line range, so every other byte — including these
# comments — is left alone, and the file is copied into $SB_HOME/backups/
# before it changes.
#
# A tool is a NAME plus a SB ARGV. `argv` starts with a sb command — `run` or
# `data` — never a bare executable. That is not a formality: a tool that could
# name any executable would be a second `sb run`, one that skips the read/write
# split everything else depends on.
#
#   data  reads another CLI's JSON. May be pinned and refreshed.
#   run   acts. Never given a cadence, because re-running a write on a timer is
#         a scheduler nobody asked for.
#
# `acts` is inherited from that first word and cannot be declared here. You
# already asserted read-or-write by choosing `data` over `run`.
#
# `group` is optional and is a label the tools rail sorts under, nothing more.
# It never becomes part of the address: `sb tools prs`, never `sb tools jam prs`,
# and names stay unique across every group. Leave it out to be ungrouped.
#
# A group exists if any command names it, or if it is declared with a
# [group.NAME] table of its own — neither implies the other. Declaring one is
# how an *empty* group exists, which is what the rail's "+ group" button
# writes. A declared group may carry a description and nothing else.
#
# A leading ~ in an argv is expanded, so your own paths work.
# A tool takes no arguments: `sb prs 945` is an error, not an append.
# A tool can never shadow a sb command; that declaration is skipped and named.
# `sb tools` lists what loaded, and what was refused and why.

[group.code]
description = "Anything about a checkout"

[group.box]
description = "This machine"

# Declared and empty: it exists so you can drag things into it. Delete it from
# the rail — that only works while nothing is in it.
[group.archive]

[tool.prs]
description = "Open pull requests"
group = "code"
# Many tools resolve their environment against the working directory rather
# than their installed location, so --cwd is often needed even on PATH.
argv = ["data", "--cwd", "/path/to/your/checkout",
        "--", "somecli", "pr", "list", "--json"]
# Seconds between refreshes on the canvas. Only 0, 5, 30, 60 or 300 — the
# surface cycles the interval through that list, and a window starting outside
# it would jump to 0 on the first click instead of to the next cadence up.
refresh = 30

[tool.containers]
description = "What is running"
group = "box"
# --cols picks the columns when the automatic shaping guesses wrong; the
# warning on a shaped table names what it hid, so you know what to ask for.
argv = ["data", "--cols", "Names,Image,Status",
        "--", "docker", "ps", "--format", "json"]
refresh = 5

[tool.disk]
description = "What is left on this box"
group = "box"
# This one acts, because `run` acts. No `refresh` is permitted on it.
argv = ["run", "--", "df", "-h", "/"]

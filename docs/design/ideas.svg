<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 236" width="1000" height="236" role="img" aria-label="One command acts: sb run is the only one. Everything else reads, so a window can re-run a read, never a write. Data, never print: One envelope — ok, partial, data, warnings — drawn by whoever consumes it. --json hands it over. Never guesses: sb data takes JSON; sb read shows output verbatim and says so. There is no --pretty that guesses. Not in the credential path: External CLIs keep their own authentication. sky.boss never holds a key.">
  <title>Four ideas</title>
